# Used only by the migrate-mysql job in .github/workflows/ci.yml, which copies
# this over config/database.yml. It is a separate file because database.yml
# pins `url: sqlite3:...` for test on purpose, so a DATABASE_URL env var alone
# cannot point the test env at MySQL.
#
# `url:` here for the same reason: an adapter/host/database block loses to a
# workspace-wide DATABASE_URL, which on a dev machine can point at an unrelated
# database - and this job migrates from zero, so that would matter.
#
# CI_MYSQL_PORT exists so the same file reproduces the job locally when 3306 is
# already taken:
#
#   docker run --rm -d --name dpc-ci-mysql -e MYSQL_ROOT_PASSWORD=ci \
#     -p 3307:3306 mysql:8.0
#   cp .github/ci/database.mysql.yml config/database.yml
#   CI_MYSQL_PORT=3307 RAILS_ENV=test bin/rails db:create db:migrate
test:
  url: mysql2://root:ci@127.0.0.1:<%= ENV.fetch('CI_MYSQL_PORT', 3306) %>/dink_pony_club_ci
  encoding: utf8mb4
  max_connections: 5
