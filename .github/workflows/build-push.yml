name: Build and push image

on:
  push: {}
  workflow_dispatch: {}

# Avoids two pushes racing to push the same tag.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  build-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install system deps for bundling (mysql2 native extension)
        uses: awalsh128/cache-apt-pkgs-action@553a35bb8ebd9fcabcb1c9451aa4c98e1b4ca8a9 # v1.6.3
        with:
          packages: default-libmysqlclient-dev
          version: 1.0

      - uses: ruby/setup-ruby@984c0c890880bbf811283d6f09c4607c62d210a4 # v1.323.0
        with:
          ruby-version: "3.4.10"
          bundler-cache: true

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Reuses the app's own Kamal config/versioning so the tag this step
      # pushes is exactly what `kamal deploy --skip_push` will look for.
      - name: kamal build push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          export APP_VERSION="$(git rev-list --count HEAD)"
          export APP_BUILT_AT="$(git log -1 --format=%cI)"
          bundle exec kamal build push

      # Only main, so a feature branch can't evict main's own deployable tags.
      # continue-on-error: cleanup is best-effort, must not block deploy.yml.
      - name: Prune old image versions in GHCR
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        continue-on-error: true
        uses: dataaxiom/ghcr-cleanup-action@d52806a0dc70b430571a37da1fde39733ffd640f # v1.2.2
        with:
          package: dink_pony_club
          delete-untagged: true
          keep-n-tagged: 5
