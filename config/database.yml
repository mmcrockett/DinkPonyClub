# SQLite. Versions 3.8.0 and up are supported.
#   gem install sqlite3
#
#   Ensure the SQLite 3 gem is defined in your Gemfile
#   gem "sqlite3"
#
default: &default
  adapter: sqlite3
  max_connections: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  timeout: 5000

# url: (not adapter:/database:) so a workspace-wide DATABASE_URL env var can't override this.
development:
  <<: *default
  url: sqlite3:storage/development.sqlite3

# Warning: The database defined as "test" will be erased and
# re-generated from your development database when you run "rake".
# Do not set this db to the same as development or production.
test:
  <<: *default
  url: sqlite3:storage/test.sqlite3

# Primary app data lives in a local sqlite3 file on the persistent Docker volume
# from config/deploy.yml (queries over the network to the shared
# mysql.mmcrockett.com host cost ~57ms each). DatabaseBackupJob copies it to
# mysql_backup hourly; restore with
# `FROM=mysql_backup TO=primary bin/rails db:sync:copy`. Solid Cache/Queue/Cable
# keep their own local sqlite3 stores on the same volume.
production:
  primary:
    <<: *default
    database: storage/production.sqlite3
  mysql_backup:
    url: <%= Rails.application.credentials.mysql_url %>
    migrations_paths: db/migrate
    schema_dump: false
  cache:
    <<: *default
    database: storage/production_cache.sqlite3
    migrations_paths: db/cache_migrate
  queue:
    <<: *default
    database: storage/production_queue.sqlite3
    migrations_paths: db/queue_migrate
  cable:
    <<: *default
    database: storage/production_cable.sqlite3
    migrations_paths: db/cable_migrate
