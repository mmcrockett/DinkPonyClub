# Files in the config/locales directory are used for internationalization and
# are automatically loaded by Rails. If you want to use locales other than
# English, add the necessary files in this directory.
#
# To use the locales, use `I18n.t`:
#
#     I18n.t "hello"
#
# In views, this is aliased to just `t`:
#
#     <%= t("hello") %>
#
# To use a different locale, set it with `I18n.locale`:
#
#     I18n.locale = :es
#
# This would use the information in config/locales/es.yml.
#
# To learn more about the API, please read the Rails Internationalization guide
# at https://guides.rubyonrails.org/i18n.html.
#
# Be aware that YAML interprets the following case-insensitive strings as
# booleans: `true`, `false`, `on`, `off`, `yes`, `no`. Therefore, these strings
# must be quoted to be interpreted as strings. For example:
#
#     en:
#       "yes": yup
#       enabled: "ON"

en:
  hello: "Hello world"
  sessions:
    create:
      not_on_roster: "That Google account is not on the Dink Pony Club roster."
      welcome: "Welcome, %{first_name}!"
    destroy:
      signed_out: "Signed out."
    failure:
      failed: "Google sign-in failed. Please try again."
  admin:
    players:
      create:
        created: "%{name} was added."
      form:
        own_status: "%{status} - you can't change your own status."
      update:
        updated: "%{name} was updated."
  authentication:
    require_sign_in: "Sign in to view that page."
    require_admin: "You don't have permission to view that page."
    require_captain_or_admin: "You don't have permission to view that page."
  availabilities:
    update:
      saved: "Thanks! Your availability has been saved."
      closed: "Availability for this match has closed."
      invalid_status: "That availability status wasn't recognized. Please try again."
    update_for_player:
      saved: "%{name}'s availability was saved."
      invalid_status: "That availability status wasn't recognized. Please try again."
      not_on_roster: "That player isn't on this season's roster."
  matches:
    forbidden: "Only captains of the two teams in this match can enter results."
    update:
      saved: "Scorecard saved."
  match_nights:
    schedule:
      title: "The season schedule"
      subtitle: "Set your availability now. Update it whenever plans change."
      team_availability: "Team availability"
      show_matchups: "Show matchups"
      empty: "No match nights are scheduled yet."
      weeks_completed: "Weeks completed"
      up_next: "Up next"
      are_you_playing: "Are you playing?"
      im_in: "I'm in"
      maybe: "Maybe"
      im_out: "I'm out"
      closed_note: "Contact your captain directly if you need to change."
      canceled: "Canceled"
      playoffs: "Playoffs"
      final: "Final"
      scheduled: "Scheduled"
      vs: "vs"
      back_to_schedule: "Back to schedule"
