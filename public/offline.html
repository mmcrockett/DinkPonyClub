<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Dink Pony Club - Offline</title>
    <style>
      body {
        margin: 0;
        display: flex;
        min-height: 100vh;
        align-items: center;
        justify-content: center;
        background-color: #f5f1e6;
        color: #16325c;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        text-align: center;
      }
      main {
        max-width: 24rem;
        padding: 2rem;
      }
      h1 {
        margin: 0 0 0.5rem;
        font-size: 1.5rem;
        font-weight: 800;
      }
      p {
        margin: 0 0 1.5rem;
        color: #16325c;
        opacity: 0.7;
      }
      button {
        border: none;
        border-radius: 0.5rem;
        background-color: #1f4d2c;
        color: #fff;
        font-size: 1rem;
        font-weight: 600;
        padding: 0.75rem 1.5rem;
        cursor: pointer;
      }
      button:hover {
        opacity: 0.9;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>You're offline</h1>
      <p>Dink Pony Club can't reach the network right now. Check your connection and try again.</p>
      <button onclick="location.reload()">Reload</button>
    </main>
  </body>
</html>
